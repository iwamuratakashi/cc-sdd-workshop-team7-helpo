<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ検索 - Helpo</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      background: #2563eb;
      color: #fff;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== Mockup Controls ===== */
    .mockup-controls {
      background: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      padding: 16px 32px;
    }

    .mockup-controls-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 12px;
    }

    .mockup-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mockup-btn {
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mockup-btn:hover {
      background: #f3f4f6;
    }

    .mockup-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* ===== Main Container ===== */
    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .section {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #111827;
    }

    /* ===== Question Input ===== */
    .question-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    .question-textarea {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.7;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
      color: #1a1a1a;
      background: #fff;
      transition: border-color 0.15s;
    }

    .question-textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .question-textarea:disabled {
      background: #f9fafb;
      color: #9ca3af;
    }

    .submit-row {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .submit-btn {
      padding: 14px 48px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .char-counter {
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
      text-align: right;
    }

    /* ===== Loading ===== */
    .loading-area {
      display: none;
    }

    .loading-area.visible {
      display: block;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
      color: #4b5563;
      font-size: 16px;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Result Area ===== */
    .result-area {
      display: none;
    }

    .result-area.visible {
      display: block;
    }

    .result-status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .result-status.match {
      background: #e0e7ff;
      color: #3730a3;
    }

    .result-status.no-match {
      background: #fef3c7;
      color: #92400e;
    }

    .result-answer {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .candidates-title {
      font-size: 16px;
      font-weight: 700;
      color: #6b7280;
      margin: 24px 0 16px 0;
    }

    .candidate-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .candidate-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .candidate-question {
      font-weight: 700;
      color: #111827;
    }

    .candidate-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #6b7280;
    }

    .confidence-badge {
      display: inline-block;
      padding: 2px 10px;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .confidence-badge.low {
      background: #f3f4f6;
      color: #6b7280;
    }

    .match-badge {
      display: inline-block;
      padding: 2px 10px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .candidate-answer {
      font-size: 16px;
      line-height: 1.7;
      color: #374151;
      margin-top: 8px;
    }

    /* ===== Error Area ===== */
    .error-area {
      display: none;
    }

    .error-area.visible {
      display: block;
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 16px;
      color: #991b1b;
      font-size: 16px;
      line-height: 1.7;
    }

    .error-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .error-detail {
      font-size: 14px;
      color: #b91c1c;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      color: #6b7280;
      padding: 48px 0;
      font-size: 16px;
      line-height: 1.7;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header class="header">
    <div class="header-title">
      <span>Helpo</span>
      <span style="font-weight: 400; font-size: 14px; opacity: 0.8;">FAQ検索</span>
    </div>
  </header>

  <!-- ===== モックアップ状態切替コントロール ===== -->
  <div class="mockup-controls">
    <div class="mockup-controls-title">モックアップ状態切替</div>
    <div class="mockup-btn-group">
      <button class="mockup-btn active" onclick="setState('empty')">空っぽ</button>
      <button class="mockup-btn" onclick="setState('loading')">読み込み中</button>
      <button class="mockup-btn" onclick="setState('success')">成功</button>
      <button class="mockup-btn" onclick="setState('error')">エラー</button>
    </div>
  </div>

  <!-- ===== メインコンテンツ ===== -->
  <main class="main">

    <!-- 質問入力 -->
    <section class="section">
      <h1 class="section-title">質問を入力してください</h1>
      <label class="question-label" for="question">お困りごとを自分の言葉で入力してください</label>
      <textarea id="question" class="question-textarea" placeholder="例：有給休暇は何日前に申請すればよいですか？"></textarea>
      <div class="char-counter" id="char-count">0 / 400</div>
      <div class="submit-row">
        <button id="submit-btn" class="submit-btn" onclick="handleSubmit()">検索する</button>
      </div>
    </section>

    <!-- 読み込み中 -->
    <section id="loading-area" class="section loading-area">
      <div class="loading-indicator">
        <div class="loading-spinner"></div>
        <span>FAQを検索しています...</span>
      </div>
    </section>

    <!-- 検索結果 -->
    <section id="result-area" class="section result-area">
      <div id="result-status" class="result-status"></div>
      <div id="result-answer" class="result-answer"></div>
      <div id="candidates-title" class="candidates-title">候補FAQ</div>
      <ul id="candidate-list" class="candidate-list"></ul>
    </section>

    <!-- エラー -->
    <section id="error-area" class="section error-area">
      <div class="error-msg">
        <div id="error-title" class="error-title"></div>
        <div id="error-detail" class="error-detail"></div>
      </div>
    </section>

    <!-- 空っぽ -->
    <section id="empty-area" class="section">
      <div class="empty-state">
        質問を入力して「検索する」ボタンを押すと、FAQ候補が表示されます。
      </div>
    </section>

  </main>

  <script>
    // ===== ダミー検索関数 =====
    // APIは呼ばず、ダミーデータを返す
    function searchFaq(query, mode) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (mode === 'success') {
            resolve({
              query: query,
              candidates: [
                {
                  faq_id: 1,
                  question: '有給休暇は何日前に申請すればよいですか',
                  answer: '原則として3営業日前までに申請してください。',
                  confidence: 0.92,
                  is_match: true
                },
                {
                  faq_id: 3,
                  question: '休暇申請の承認フローを教えてください',
                  answer: '休暇申請は直属の上長が承認します。承認後、申請者と人事部に通知メールが送信されます。',
                  confidence: 0.78,
                  is_match: false
                },
                {
                  faq_id: 5,
                  question: '夏季休暇はいつ取得できますか',
                  answer: '夏季休暇は8月14日から16日まで取得できます。取得には事前申請が必要です。',
                  confidence: 0.45,
                  is_match: false
                }
              ],
              has_match: true
            });
          } else if (mode === 'no_match') {
            resolve({
              query: query,
              candidates: [
                {
                  faq_id: 7,
                  question: '社員旅行の参加費用はどうなりますか',
                  answer: '社員旅行の参加費用は会社負担となります。',
                  confidence: 0.32,
                  is_match: false
                }
              ],
              has_match: false
            });
          } else if (mode === 'error_503') {
            reject({ status: 503, title: '検索サービスを利用できません', detail: 'Embeddingモデルが未ロードです。管理者に連絡してください。' });
          } else if (mode === 'error_500') {
            reject({ status: 500, title: 'システムエラーが発生しました', detail: '予期しないエラーが発生しました。時間をおいて再度お試しください。' });
          } else if (mode === 'error_422') {
            reject({ status: 422, title: '入力内容を確認してください', detail: '質問文が未入力です。' });
          } else {
            reject({ status: 500, title: 'システムエラーが発生しました', detail: '予期しないエラーが発生しました。' });
          }
        }, 1000);
      });
    }

    // ===== DOM要素参照 =====
    var elQuestion      = document.getElementById('question');
    var elCharCount     = document.getElementById('char-count');
    var elSubmitBtn     = document.getElementById('submit-btn');
    var elLoadingArea   = document.getElementById('loading-area');
    var elResultArea    = document.getElementById('result-area');
    var elResultStatus  = document.getElementById('result-status');
    var elResultAnswer  = document.getElementById('result-answer');
    var elCandidatesTitle = document.getElementById('candidates-title');
    var elCandidateList = document.getElementById('candidate-list');
    var elErrorArea     = document.getElementById('error-area');
    var elErrorTitle    = document.getElementById('error-title');
    var elErrorDetail   = document.getElementById('error-detail');
    var elEmptyArea     = document.getElementById('empty-area');

    // ===== 文字数カウンター =====
    elQuestion.addEventListener('input', function () {
      var len = elQuestion.value.length;
      elCharCount.textContent = len + ' / 400';
    });

    // ===== 全エリアリセット =====
    function resetAll() {
      elLoadingArea.classList.remove('visible');
      elResultArea.classList.remove('visible');
      elErrorArea.classList.remove('visible');
      elErrorTitle.textContent = '';
      elErrorDetail.textContent = '';
      elResultStatus.textContent = '';
      elResultStatus.className = 'result-status';
      elResultAnswer.textContent = '';
      elCandidateList.innerHTML = '';
      elSubmitBtn.disabled = false;
      elQuestion.disabled = false;
    }

    // ===== 候補FAQ表示 =====
    function showCandidates(candidates, hasMatch) {
      elCandidateList.innerHTML = '';
      for (var i = 0; i < candidates.length; i++) {
        var c = candidates[i];
        var li = document.createElement('li');
        li.className = 'candidate-item';

        var header = document.createElement('div');
        header.className = 'candidate-header';

        var q = document.createElement('div');
        q.className = 'candidate-question';
        q.textContent = c.question;
        header.appendChild(q);

        var meta = document.createElement('div');
        meta.className = 'candidate-meta';

        var conf = document.createElement('span');
        conf.className = 'confidence-badge' + (c.confidence >= 0.7 ? '' : ' low');
        conf.textContent = c.confidence.toFixed(2);
        meta.appendChild(conf);

        if (c.is_match) {
          var match = document.createElement('span');
          match.className = 'match-badge';
          match.textContent = '回答提示可';
          meta.appendChild(match);
        }

        header.appendChild(meta);
        li.appendChild(header);

        var a = document.createElement('div');
        a.className = 'candidate-answer';
        a.textContent = c.answer;
        li.appendChild(a);

        elCandidateList.appendChild(li);
      }

      // has_match=true の場合は最も類似度の高い回答をそのまま表示
      if (hasMatch) {
        var topMatch = candidates.find(function (c) { return c.is_match; });
        elResultAnswer.textContent = topMatch ? topMatch.answer : '';
        elResultStatus.textContent = '回答として提示できる候補が見つかりました';
        elResultStatus.classList.add('match');
      } else {
        elResultAnswer.textContent = '該当する回答が見つかりませんでした。人事部（内線：1234）または総務部（内線：5678）までお問い合わせください。';
        elResultStatus.textContent = '該当する回答が見つかりません';
        elResultStatus.classList.add('no-match');
      }
    }

    // ===== 状態切替（モックアップ用） =====
    function setState(state) {
      resetAll();

      // ボタンのアクティブ状態更新
      var btns = document.querySelectorAll('.mockup-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      var clicked = event ? event.target : null;
      if (clicked && clicked.classList.contains('mockup-btn')) {
        clicked.classList.add('active');
      }

      switch (state) {
        case 'empty':
          elEmptyArea.classList.remove('hidden');
          elQuestion.value = '';
          elCharCount.textContent = '0 / 400';
          break;

        case 'loading':
          elEmptyArea.classList.add('hidden');
          elQuestion.value = '有給休暇の申請方法を教えてください';
          elCharCount.textContent = elQuestion.value.length + ' / 400';
          elLoadingArea.classList.add('visible');
          elSubmitBtn.disabled = true;
          elQuestion.disabled = true;
          break;

        case 'success':
          elEmptyArea.classList.add('hidden');
          elQuestion.value = '有給休暇の申請方法を教えてください';
          elCharCount.textContent = elQuestion.value.length + ' / 400';
          elResultArea.classList.add('visible');
          searchFaq(elQuestion.value, 'success').then(function (data) {
            showCandidates(data.candidates, data.has_match);
          });
          break;

        case 'error':
          elEmptyArea.classList.add('hidden');
          elQuestion.value = '有給休暇の申請方法を教えてください';
          elCharCount.textContent = elQuestion.value.length + ' / 400';
          elErrorArea.classList.add('visible');
          elErrorTitle.textContent = '検索サービスを利用できません';
          elErrorDetail.textContent = 'Embeddingモデルが未ロードです。管理者に連絡してください。';
          break;
      }
    }

    // ===== 送信処理 =====
    function handleSubmit() {
      var query = elQuestion.value.trim();

      // 入力検証
      if (!query) {
        resetAll();
        elEmptyArea.classList.add('hidden');
        elErrorArea.classList.add('visible');
        elErrorTitle.textContent = '入力内容を確認してください';
        elErrorDetail.textContent = '質問文が未入力です。';
        return;
      }

      if (query.length > 400) {
        resetAll();
        elEmptyArea.classList.add('hidden');
        elErrorArea.classList.add('visible');
        elErrorTitle.textContent = '入力内容を確認してください';
        elErrorDetail.textContent = '質問文は400文字以内で入力してください。';
        return;
      }

      resetAll();
      elEmptyArea.classList.add('hidden');
      elLoadingArea.classList.add('visible');
      elSubmitBtn.disabled = true;
      elQuestion.disabled = true;

      // 実際のAPI呼び出しの代わりにダミー関数を呼ぶ
      // デモ用に success を返す。error に切り替えたい場合は setState('error') を使う
      searchFaq(query, 'success')
        .then(function (data) {
          elLoadingArea.classList.remove('visible');
          elResultArea.classList.add('visible');
          showCandidates(data.candidates, data.has_match);
        })
        .catch(function (err) {
          elLoadingArea.classList.remove('visible');
          elErrorArea.classList.add('visible');
          elErrorTitle.textContent = err.title;
          elErrorDetail.textContent = err.detail;
        })
        .finally(function () {
          elSubmitBtn.disabled = false;
          elQuestion.disabled = false;
        });
    }

    // 初期状態
    setState('empty');
  </script>
</body>
</html>
