<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQアップロード - Helpo</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      background: #2563eb;
      color: #fff;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== Mockup Controls ===== */
    .mockup-controls {
      background: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      padding: 16px 32px;
    }

    .mockup-controls-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 12px;
    }

    .mockup-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mockup-btn {
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mockup-btn:hover {
      background: #f3f4f6;
    }

    .mockup-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* ===== Main Container ===== */
    .main {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .section {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #111827;
    }

    .description {
      font-size: 16px;
      line-height: 1.7;
      color: #374151;
      margin-bottom: 24px;
    }

    .description-list {
      margin-top: 12px;
      padding-left: 24px;
      color: #374151;
      font-size: 16px;
      line-height: 1.7;
    }

    .description-list li {
      margin-bottom: 8px;
    }

    .file-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .file-input {
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
    }

    .file-name {
      font-size: 14px;
      color: #6b7280;
      min-height: 24px;
    }

    .submit-row {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .submit-btn {
      padding: 14px 48px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    /* ===== Loading ===== */
    .loading-area {
      display: none;
    }

    .loading-area.visible {
      display: block;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 0;
      color: #4b5563;
      font-size: 16px;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== Result Area ===== */
    .result-area {
      display: none;
    }

    .result-area.visible {
      display: block;
    }

    .result-status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: #e0e7ff;
      color: #3730a3;
    }

    .result-message {
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .uploaded-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }

    .uploaded-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    .uploaded-question {
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    .uploaded-answer {
      font-size: 16px;
      line-height: 1.7;
      color: #374151;
    }

    /* ===== Error Area ===== */
    .error-area {
      display: none;
    }

    .error-area.visible {
      display: block;
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 16px;
      color: #991b1b;
      font-size: 16px;
      line-height: 1.7;
    }

    .error-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .error-detail {
      font-size: 14px;
      color: #b91c1c;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      color: #6b7280;
      padding: 48px 0;
      font-size: 16px;
      line-height: 1.7;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header class="header">
    <div class="header-title">
      <span>Helpo</span>
      <span style="font-weight: 400; font-size: 14px; opacity: 0.8;">FAQ管理</span>
    </div>
  </header>

  <!-- ===== モックアップ状態切替コントロール ===== -->
  <div class="mockup-controls">
    <div class="mockup-controls-title">モックアップ状態切替</div>
    <div class="mockup-btn-group">
      <button class="mockup-btn active" onclick="setState('empty')">空っぽ</button>
      <button class="mockup-btn" onclick="setState('loading')">読み込み中</button>
      <button class="mockup-btn" onclick="setState('success')">成功</button>
      <button class="mockup-btn" onclick="setState('error')">エラー</button>
    </div>
  </div>

  <!-- ===== メインコンテンツ ===== -->
  <main class="main">

    <!-- アップロードフォーム -->
    <section class="section">
      <h1 class="section-title">FAQをアップロード</h1>
      <p class="description">
        Markdownファイル（.md）をアップロードして、FAQを一括登録します。
      </p>
      <ul class="description-list">
        <li>アップロードできるファイル形式は Markdown（.md）のみです。</li>
        <li>ファイルサイズは 10MB 以内にしてください。</li>
        <li>質問文は <code>## </code> から始まる見出し、回答文はその直後の段落として記述してください。</li>
      </ul>

      <label class="file-label" for="faq-file">Markdownファイル</label>
      <div class="file-input-wrapper">
        <input id="faq-file" type="file" class="file-input" accept=".md,text/markdown" onchange="updateFileName()">
      </div>
      <div class="file-name" id="file-name">選択されたファイルはありません</div>

      <div class="submit-row">
        <button id="submit-btn" class="submit-btn" onclick="handleUpload()">アップロード</button>
      </div>
    </section>

    <!-- 読み込み中 -->
    <section id="loading-area" class="section loading-area">
      <div class="loading-indicator">
        <div class="loading-spinner"></div>
        <span>FAQを登録しています...</span>
      </div>
    </section>

    <!-- 登録結果 -->
    <section id="result-area" class="section result-area">
      <div class="result-status">登録完了</div>
      <div id="result-message" class="result-message"></div>
      <ul id="uploaded-list" class="uploaded-list"></ul>
    </section>

    <!-- エラー -->
    <section id="error-area" class="section error-area">
      <div class="error-msg">
        <div id="error-title" class="error-title"></div>
        <div id="error-detail" class="error-detail"></div>
      </div>
    </section>

    <!-- 空っぽ -->
    <section id="empty-area" class="section">
      <div class="empty-state">
        Markdownファイルを選択して「アップロード」ボタンを押すと、FAQが登録されます。
      </div>
    </section>

  </main>

  <script>
    // ===== ダミーアップロード関数 =====
    // APIは呼ばず、ダミー結果を返す
    function uploadFaqs(file, mode) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (mode === 'success') {
            resolve({
              count: 3,
              faqs: [
                {
                  id: 1,
                  question: '有給休暇は何日前に申請すればよいですか',
                  answer: '原則として3営業日前までに申請してください。'
                },
                {
                  id: 2,
                  question: '経費精算の締め日はいつですか',
                  answer: '経費精算の締め日は毎月25日です。25日が土日祝日の場合は、直前の営業日が締め日となります。'
                },
                {
                  id: 3,
                  question: '健康診断の予約方法を教えてください',
                  answer: '毎年10月に人事部から予約案内メールが届きます。指定機関の Web サイトから希望日を選択してください。'
                }
              ]
            });
          } else if (mode === 'error_format') {
            reject({ title: 'ファイル形式が正しくありません', detail: 'アップロードできるファイル形式は Markdown（.md）のみです。' });
          } else if (mode === 'error_size') {
            reject({ title: 'ファイルサイズが超過しています', detail: 'アップロードできるファイルサイズは 10MB 以内です。' });
          } else if (mode === 'error_parse') {
            reject({ title: 'Markdownファイルの内容を確認してください', detail: 'ファイル内に有効なQ&Aセクションが見つかりません。質問文と回答文のセットを ## 見出しと段落で記述してください。' });
          } else if (mode === 'error_duplicate') {
            reject({ title: 'Markdownファイルの内容を確認してください', detail: 'ファイル内に同じ質問文が重複しています。' });
          } else if (mode === 'error_unauthorized') {
            reject({ title: 'ログインが必要です', detail: 'FAQの登録はログインした管理者のみが行えます。' });
          } else if (mode === 'error_forbidden') {
            reject({ title: '権限がありません', detail: 'FAQの登録は管理者のみが行えます。' });
          } else if (mode === 'error_500') {
            reject({ title: 'システムエラーが発生しました', detail: '予期しないエラーが発生しました。時間をおいて再度お試しください。' });
          } else {
            reject({ title: 'システムエラーが発生しました', detail: '予期しないエラーが発生しました。' });
          }
        }, 1000);
      });
    }

    // ===== DOM要素参照 =====
    var elFileInput   = document.getElementById('faq-file');
    var elFileName    = document.getElementById('file-name');
    var elSubmitBtn   = document.getElementById('submit-btn');
    var elLoadingArea = document.getElementById('loading-area');
    var elResultArea  = document.getElementById('result-area');
    var elResultMsg   = document.getElementById('result-message');
    var elUploadedList = document.getElementById('uploaded-list');
    var elErrorArea   = document.getElementById('error-area');
    var elErrorTitle  = document.getElementById('error-title');
    var elErrorDetail = document.getElementById('error-detail');
    var elEmptyArea   = document.getElementById('empty-area');

    // ===== ファイル名表示更新 =====
    function updateFileName() {
      if (elFileInput.files && elFileInput.files.length > 0) {
        elFileName.textContent = elFileInput.files[0].name;
      } else {
        elFileName.textContent = '選択されたファイルはありません';
      }
    }

    // ===== 全エリアリセット =====
    function resetAll() {
      elLoadingArea.classList.remove('visible');
      elResultArea.classList.remove('visible');
      elErrorArea.classList.remove('visible');
      elErrorTitle.textContent = '';
      elErrorDetail.textContent = '';
      elResultMsg.textContent = '';
      elUploadedList.innerHTML = '';
      elSubmitBtn.disabled = false;
      elFileInput.disabled = false;
    }

    // ===== 登録結果表示 =====
    function showResult(data) {
      elResultMsg.textContent = data.count + '件のFAQを登録しました。';
      for (var i = 0; i < data.faqs.length; i++) {
        var f = data.faqs[i];
        var li = document.createElement('li');
        li.className = 'uploaded-item';

        var q = document.createElement('div');
        q.className = 'uploaded-question';
        q.textContent = 'FAQ ID: ' + f.id + ' — ' + f.question;
        li.appendChild(q);

        var a = document.createElement('div');
        a.className = 'uploaded-answer';
        a.textContent = f.answer;
        li.appendChild(a);

        elUploadedList.appendChild(li);
      }
    }

    // ===== 状態切替（モックアップ用） =====
    function setState(state) {
      resetAll();

      // ボタンのアクティブ状態更新
      var btns = document.querySelectorAll('.mockup-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      var clicked = event ? event.target : null;
      if (clicked && clicked.classList.contains('mockup-btn')) {
        clicked.classList.add('active');
      }

      switch (state) {
        case 'empty':
          elEmptyArea.classList.remove('hidden');
          elFileInput.value = '';
          elFileName.textContent = '選択されたファイルはありません';
          break;

        case 'loading':
          elEmptyArea.classList.add('hidden');
          elFileName.textContent = 'sample_faq.md';
          elLoadingArea.classList.add('visible');
          elSubmitBtn.disabled = true;
          elFileInput.disabled = true;
          break;

        case 'success':
          elEmptyArea.classList.add('hidden');
          elFileName.textContent = 'sample_faq.md';
          elResultArea.classList.add('visible');
          uploadFaqs(null, 'success').then(function (data) {
            showResult(data);
          });
          break;

        case 'error':
          elEmptyArea.classList.add('hidden');
          elFileName.textContent = 'sample_faq.md';
          elErrorArea.classList.add('visible');
          elErrorTitle.textContent = 'Markdownファイルの内容を確認してください';
          elErrorDetail.textContent = 'ファイル内に有効なQ&Aセクションが見つかりません。質問文と回答文のセットを ## 見出しと段落で記述してください。';
          break;
      }
    }

    // ===== アップロード処理 =====
    function handleUpload() {
      var file = elFileInput.files[0];

      // 入力検証（空）
      if (!file) {
        resetAll();
        elEmptyArea.classList.add('hidden');
        elErrorArea.classList.add('visible');
        elErrorTitle.textContent = 'ファイルを選択してください';
        elErrorDetail.textContent = 'アップロードするMarkdownファイルが選択されていません。';
        return;
      }

      // 拡張子・MIME検証
      var isMarkdown = file.name.toLowerCase().endsWith('.md') || file.type === 'text/markdown';
      if (!isMarkdown) {
        resetAll();
        elEmptyArea.classList.add('hidden');
        elErrorArea.classList.add('visible');
        elErrorTitle.textContent = 'ファイル形式が正しくありません';
        elErrorDetail.textContent = 'アップロードできるファイル形式は Markdown（.md）のみです。';
        return;
      }

      // サイズ検証（10MB）
      var maxSize = 10 * 1024 * 1024;
      if (file.size > maxSize) {
        resetAll();
        elEmptyArea.classList.add('hidden');
        elErrorArea.classList.add('visible');
        elErrorTitle.textContent = 'ファイルサイズが超過しています';
        elErrorDetail.textContent = 'アップロードできるファイルサイズは 10MB 以内です。';
        return;
      }

      resetAll();
      elEmptyArea.classList.add('hidden');
      elLoadingArea.classList.add('visible');
      elSubmitBtn.disabled = true;
      elFileInput.disabled = true;

      // 実際のAPI呼び出しの代わりにダミー関数を呼ぶ
      // デモ用に success を返す。error に切り替えたい場合は setState('error') を使う
      uploadFaqs(file, 'success')
        .then(function (data) {
          elLoadingArea.classList.remove('visible');
          elResultArea.classList.add('visible');
          showResult(data);
        })
        .catch(function (err) {
          elLoadingArea.classList.remove('visible');
          elErrorArea.classList.add('visible');
          elErrorTitle.textContent = err.title;
          elErrorDetail.textContent = err.detail;
        })
        .finally(function () {
          elSubmitBtn.disabled = false;
          elFileInput.disabled = false;
        });
    }

    // 初期状態
    setState('empty');
  </script>
</body>
</html>
