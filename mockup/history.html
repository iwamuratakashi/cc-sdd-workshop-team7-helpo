<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI社内ヘルプデスク - 質問履歴</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header (WebLayout mock) ===== */
    .header {
      background: #2563eb;
      color: #fff;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== Mockup Controls ===== */
    .mockup-controls {
      background: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      padding: 16px 32px;
    }

    .mockup-controls-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mockup-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mockup-btn-group-label {
      font-size: 13px;
      font-weight: 600;
      color: #78350f;
      width: 100%;
      margin-bottom: 2px;
    }

    .mockup-btn {
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mockup-btn:hover {
      background: #f3f4f6;
    }

    .mockup-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* ===== Main Container ===== */
    .main {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    /* ===== Page Title ===== */
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    /* ===== Section shared ===== */
    .section {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    /* ===== Total Count ===== */
    .total-count {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    /* ===== History Table ===== */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      line-height: 1.7;
    }

    .history-table th {
      background: #f9fafb;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 2px solid #e5e7eb;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
      font-size: 14px;
    }

    .history-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
      color: #1a1a1a;
    }

    .history-table tr:last-child td {
      border-bottom: none;
    }

    .history-table tbody tr:hover {
      background: #f9fafb;
    }

    .td-datetime {
      white-space: nowrap;
      font-size: 14px;
      color: #6b7280;
    }

    .td-question,
    .td-answer {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== Status Label ===== */
    .status-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-label.ai_answer     { background: #dbeafe; color: #1e40af; }
    .status-label.direct_faq    { background: #e0e7ff; color: #3730a3; }
    .status-label.no_match      { background: #fef3c7; color: #92400e; }
    .status-label.ai_unavailable { background: #fee2e2; color: #991b1b; }
    .status-label.server_error  { background: #fee2e2; color: #991b1b; }

    /* ===== Detail Link ===== */
    .detail-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .detail-link:hover {
      text-decoration: underline;
    }

    /* ===== Pagination ===== */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 24px;
    }

    .pagination-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 20px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pagination-btn:hover:not(:disabled) {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .pagination-btn:disabled {
      background: #f9fafb;
      color: #d1d5db;
      border-color: #e5e7eb;
      cursor: not-allowed;
    }

    /* ===== Empty State ===== */
    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ===== Chat Link ===== */
    .chat-link-area {
      text-align: center;
      margin-top: 24px;
    }

    .chat-link {
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 24px;
      border: 1px solid #2563eb;
      border-radius: 8px;
      transition: all 0.15s;
    }

    .chat-link:hover {
      background: #eff6ff;
    }

    /* ===== Utility ===== */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ===== ヘッダー（helpo-foundation WebLayout mock + header-navigation-menu） ===== -->
  <header class="header" id="app-header"></header>

  <!-- ===== Mockup Controls ===== -->
  <div class="mockup-controls">
    <div class="mockup-controls-title">モックアップ状態切替</div>

    <div class="mockup-btn-group">
      <div class="mockup-btn-group-label">履歴件数パターン</div>
      <button class="mockup-btn" onclick="setState('one')">履歴1件</button>
      <button class="mockup-btn active" onclick="setState('empty')">履歴0件</button>
      <button class="mockup-btn" onclick="setState('ten')">履歴10件</button>
    </div>
  </div>

  <!-- ===== Main ===== -->
  <main class="main">
    <h1 class="page-title">質問履歴</h1>

    <!-- 件数表示 -->
    <div id="total_count" class="total-count hidden"></div>

    <!-- 履歴リスト -->
    <div id="history_list" class="section hidden">
      <table class="history-table">
        <thead>
          <tr>
            <th>日時</th>
            <th>質問（抜粋）</th>
            <th>回答（抜粋）</th>
            <th>状態</th>
            <th>詳細</th>
          </tr>
        </thead>
        <tbody id="history_tbody"></tbody>
      </table>

      <!-- Pagination -->
      <div id="pagination" class="pagination hidden">
        <button id="prev_btn" class="pagination-btn" disabled>前へ</button>
        <button id="next_btn" class="pagination-btn" disabled>次へ</button>
      </div>
    </div>

    <!-- 履歴なしメッセージ -->
    <div id="empty_msg" class="section hidden">
      <div class="empty-msg">質問履歴はありません</div>
    </div>

    <!-- チャット画面リンク -->
    <div class="chat-link-area">
      <a href="/chat" class="chat-link" id="chat_link">チャットへ戻る</a>
    </div>
  </main>

  <script>
    // ===== 状態ラベル対応表 =====
    var STATUS_LABELS = {
      ai_answer: 'AI回答',
      direct_faq: 'FAQ直接回答',
      no_match: '該当FAQなし',
      ai_unavailable: 'AI利用不可',
      server_error: 'サーバエラー'
    };

    // ===== ダミーデータ生成 =====

    function getDummyHistoryList(pattern) {
      switch (pattern) {
        case 'empty':
          return { items: [], limit: 20, offset: 0, total: 0 };

        case 'one':
          return {
            items: [
              {
                history_id: 1,
                question: '有給休暇の申請方法を教えてください',
                answer: '有給休暇の申請は、社内ポータルの「勤怠管理」メニューから行えます。「休暇申請」ボタンをクリックし、希望日と理由を入力して申請してください。',
                status: 'ai_answer',
                created_at: '2026-08-27T10:30:00Z'
              }
            ],
            limit: 20,
            offset: 0,
            total: 1
          };

        case 'ten':
          return {
            items: [
              {
                history_id: 10,
                question: '社内Wi-Fiのパスワードを教えてください',
                answer: '社内Wi-Fiのパスワードは、情報システム部から配布されるセキュリティカードに記載されています。紛失した場合は情報システム部（内線: 3456）へお問い合わせください。',
                status: 'ai_answer',
                created_at: '2026-08-28T09:15:00Z'
              },
              {
                history_id: 9,
                question: '出張申請の手順を教えてください',
                answer: 'システムエラーが発生しました。しばらく時間をおいてから再度お試しください。',
                status: 'server_error',
                created_at: '2026-08-27T16:45:00Z'
              },
              {
                history_id: 8,
                question: '健康診断の予約方法を教えてください',
                answer: 'お探しの情報が見つかりませんでした。人事部（内線: 1234）または総務部（内線: 5678）までお問い合わせください。',
                status: 'ai_unavailable',
                created_at: '2026-08-27T14:20:00Z'
              },
              {
                history_id: 7,
                question: '近くのおすすめのランチスポットを教えて',
                answer: 'お探しの情報が見つかりませんでした。人事部（内線: 1234）または総務部（内線: 5678）までお問い合わせください。',
                status: 'no_match',
                created_at: '2026-08-27T12:00:00Z'
              },
              {
                history_id: 6,
                question: '経費精算の締め日はいつですか',
                answer: '経費精算の締め日は毎月25日です。25日が土日祝日の場合は、直前の営業日が締め日となります。翌月10日に指定口座へ振り込まれます。',
                status: 'direct_faq',
                created_at: '2026-08-27T11:00:00Z'
              },
              {
                history_id: 5,
                question: '有給休暇の申請方法を教えてください',
                answer: '有給休暇の申請は、社内ポータルの「勤怠管理」メニューから行えます。「休暇申請」ボタンをクリックし、希望日と理由を入力して申請してください。申請は希望日の3営業日前までに提出が必要です。',
                status: 'ai_answer',
                created_at: '2026-08-27T10:30:00Z'
              },
              {
                history_id: 4,
                question: '社内研修の申し込み方法を教えてください',
                answer: '社内研修は人事ポータルの「研修・教育」メニューから申し込みができます。受講希望の研修を選択し、上長の承認を得てからお申し込みください。',
                status: 'ai_answer',
                created_at: '2026-08-26T15:30:00Z'
              },
              {
                history_id: 3,
                question: '名刺の追加発注はどうすればいいですか',
                answer: '名刺の追加発注は、総務部の共有フォルダにある「名刺発注申請書」に必要事項を記入し、総務部メールアドレスへ送付してください。通常5営業日で届きます。',
                status: 'direct_faq',
                created_at: '2026-08-26T10:15:00Z'
              },
              {
                history_id: 2,
                question: '会議室の予約方法を教えてください',
                answer: '会議室の予約はグループウェアの「施設予約」機能から行えます。空き状況を確認し、希望の日時と会議室を選択して予約してください。',
                status: 'ai_answer',
                created_at: '2026-08-25T14:00:00Z'
              },
              {
                history_id: 1,
                question: '社員証を紛失した場合の対応を教えてください',
                answer: '社員証を紛失した場合は、速やかに総務部（内線: 5678）へ連絡してください。紛失届を提出後、再発行手続きを行います。再発行には1週間程度かかります。',
                status: 'ai_answer',
                created_at: '2026-08-25T09:00:00Z'
              }
            ],
            limit: 20,
            offset: 0,
            total: 10
          };

        default:
          return { items: [], limit: 20, offset: 0, total: 0 };
      }
    }

    // ===== DOM要素参照 =====
    var elTotalCount   = document.getElementById('total_count');
    var elHistoryList  = document.getElementById('history_list');
    var elHistoryTbody = document.getElementById('history_tbody');
    var elPagination   = document.getElementById('pagination');
    var elPrevBtn      = document.getElementById('prev_btn');
    var elNextBtn      = document.getElementById('next_btn');
    var elEmptyMsg     = document.getElementById('empty_msg');

    // ===== HTMLエスケープ =====
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ===== 日時フォーマット (YYYY/MM/DD HH:mm) =====
    function formatDatetime(isoStr) {
      var d = new Date(isoStr);
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      var hh = String(d.getHours()).padStart(2, '0');
      var mi = String(d.getMinutes()).padStart(2, '0');
      return yyyy + '/' + mm + '/' + dd + ' ' + hh + ':' + mi;
    }

    // ===== テキスト省略 =====
    function truncate(str, maxLen) {
      if (str.length <= maxLen) return str;
      return str.substring(0, maxLen) + '...';
    }

    // ===== 全エリアリセット =====
    function resetAll() {
      elTotalCount.classList.add('hidden');
      elTotalCount.textContent = '';
      elHistoryList.classList.add('hidden');
      elHistoryTbody.innerHTML = '';
      elPagination.classList.add('hidden');
      elPrevBtn.disabled = true;
      elNextBtn.disabled = true;
      elEmptyMsg.classList.add('hidden');
    }

    // ===== 件数表示テキスト生成 =====
    function buildTotalCountText(total, offset, displayCount) {
      var from = offset + 1;
      var to = offset + displayCount;
      return '全' + total + '件中 ' + from + '〜' + to + '件';
    }

    // ===== 履歴テーブル描画 =====
    function renderHistoryTable(items) {
      elHistoryTbody.innerHTML = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var tr = document.createElement('tr');

        // 日時
        var tdDate = document.createElement('td');
        tdDate.className = 'td-datetime';
        tdDate.textContent = formatDatetime(item.created_at);
        tr.appendChild(tdDate);

        // 質問（抜粋）
        var tdQ = document.createElement('td');
        tdQ.className = 'td-question';
        tdQ.textContent = truncate(item.question, 30);
        tdQ.title = item.question;
        tr.appendChild(tdQ);

        // 回答（抜粋）
        var tdA = document.createElement('td');
        tdA.className = 'td-answer';
        tdA.textContent = truncate(item.answer, 30);
        tdA.title = item.answer;
        tr.appendChild(tdA);

        // 状態
        var tdS = document.createElement('td');
        var statusSpan = document.createElement('span');
        statusSpan.className = 'status-label ' + item.status;
        statusSpan.textContent = STATUS_LABELS[item.status] || item.status;
        tdS.appendChild(statusSpan);
        tr.appendChild(tdS);

        // 詳細リンク
        var tdD = document.createElement('td');
        var link = document.createElement('a');
        link.className = 'detail-link';
        link.href = '/chat/history/' + item.history_id;
        link.textContent = '詳細';
        link.onclick = function (e) { e.preventDefault(); };
        tdD.appendChild(link);
        tr.appendChild(tdD);

        elHistoryTbody.appendChild(tr);
      }
    }

    // ===== 状態切替メイン =====
    function setState(pattern) {
      resetAll();

      // ボタンのactive状態更新
      var btns = document.querySelectorAll('.mockup-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      if (event && event.target && event.target.classList.contains('mockup-btn')) {
        event.target.classList.add('active');
      }

      var data = getDummyHistoryList(pattern);

      if (data.total === 0) {
        // 0件: 空メッセージ表示
        elEmptyMsg.classList.remove('hidden');
      } else {
        // 件数表示
        elTotalCount.textContent = buildTotalCountText(data.total, data.offset, data.items.length);
        elTotalCount.classList.remove('hidden');

        // テーブル描画
        renderHistoryTable(data.items);
        elHistoryList.classList.remove('hidden');

        // ページネーション
        elPagination.classList.remove('hidden');
        elPrevBtn.disabled = (data.offset === 0);
        elNextBtn.disabled = (data.offset + data.limit >= data.total);
      }
    }

    // ===== 初期状態 =====
    setState('empty');
  </script>
  <script src="nav.js"></script>

</body>
</html>
