<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI社内ヘルプデスク - 質問履歴</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #1a1a1a;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header (WebLayout mock) ===== */
    .header {
      background: #2563eb;
      color: #fff;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== Mockup Controls ===== */
    .mockup-controls {
      background: #fef3c7;
      border-bottom: 2px solid #f59e0b;
      padding: 16px 32px;
    }

    .mockup-controls-title {
      font-size: 13px;
      font-weight: 700;
      color: #92400e;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mockup-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mockup-btn-group-label {
      font-size: 13px;
      font-weight: 600;
      color: #78350f;
      width: 100%;
      margin-bottom: 2px;
    }

    .mockup-btn {
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mockup-btn:hover {
      background: #f3f4f6;
    }

    .mockup-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* ===== Main Container ===== */
    .main {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    /* ===== Page Title ===== */
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    /* ===== History Card ===== */
    .history-card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-datetime {
      font-size: 14px;
      color: #6b7280;
    }

    /* ===== Status Label ===== */
    .status-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-label.ai_answer     { background: #dbeafe; color: #1e40af; }
    .status-label.direct_faq    { background: #e0e7ff; color: #3730a3; }
    .status-label.no_match      { background: #fef3c7; color: #92400e; }
    .status-label.ai_unavailable { background: #fee2e2; color: #991b1b; }
    .status-label.server_error  { background: #fee2e2; color: #991b1b; }

    /* ===== Card Sections ===== */
    .card-section {
      margin-bottom: 16px;
    }

    .card-section:last-child {
      margin-bottom: 0;
    }

    .card-section-label {
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-section-text {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ===== Source FAQ Area ===== */
    .source-area {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .source-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.7;
    }

    .source-table th {
      background: #f9fafb;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid #e5e7eb;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
      font-size: 13px;
    }

    .source-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
      color: #1a1a1a;
    }

    .source-table tr:last-child td {
      border-bottom: none;
    }

    .confidence-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    /* ===== No Source Message ===== */
    .no-source-msg {
      font-size: 14px;
      color: #92400e;
      font-weight: 600;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    /* ===== Empty State ===== */
    .empty-msg-section {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
    }

    /* ===== Utility ===== */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ===== ヘッダー（helpo-foundation WebLayout mock + header-navigation-menu） ===== -->
  <header class="header" id="app-header"></header>

  <!-- ===== Mockup Controls ===== -->
  <div class="mockup-controls">
    <div class="mockup-controls-title">モックアップ状態切替</div>

    <div class="mockup-btn-group">
      <div class="mockup-btn-group-label">履歴件数パターン</div>
      <button class="mockup-btn active" onclick="setState('empty')">履歴0件</button>
      <button class="mockup-btn" onclick="setState('one')">履歴1件（AI回答＋出典あり）</button>
      <button class="mockup-btn" onclick="setState('multi')">履歴5件（複数パターン）</button>
    </div>

    <div class="mockup-btn-group">
      <div class="mockup-btn-group-label">特殊パターン</div>
      <button class="mockup-btn" onclick="setState('deleted_faq')">FAQ削除済み出典あり</button>
      <button class="mockup-btn" onclick="setState('no_source')">出典なし（no_match）</button>
    </div>
  </div>

  <!-- ===== Main ===== -->
  <main class="main">
    <h1 class="page-title" id="page_title">質問履歴</h1>

    <!-- 履歴カードリスト -->
    <div id="history_cards"></div>

    <!-- 履歴なしメッセージ -->
    <div id="empty_msg" class="empty-msg-section hidden">
      <div class="empty-msg">質問履歴はありません</div>
    </div>
  </main>

  <script>
    // ===== 状態ラベル対応表 =====
    var STATUS_LABELS = {
      ai_answer: 'AI回答',
      direct_faq: 'FAQ直接回答',
      no_match: '該当FAQなし',
      ai_unavailable: 'AI利用不可',
      server_error: 'サーバエラー'
    };

    // ===== ダミーデータ生成 =====
    function getDummyHistoryList(pattern) {
      switch (pattern) {
        case 'empty':
          return { items: [], limit: 20, offset: 0, total: 0 };

        case 'one':
          return {
            items: [
              {
                history_id: 1,
                question: '有給休暇の申請方法を教えてください',
                answer: '有給休暇の申請は、社内ポータルの「勤怠管理」メニューから行えます。「休暇申請」ボタンをクリックし、希望日と理由を入力して申請してください。申請は希望日の3営業日前までに提出が必要です。上長の承認後、申請完了の通知メールが届きます。',
                status: 'ai_answer',
                created_at: '2026-08-27T10:30:00Z',
                sources: [
                  {
                    faq_id_at_answer: 12,
                    current_faq_id: 12,
                    question: '有給休暇はどのように申請しますか？',
                    answer: '社内ポータルの「勤怠管理」→「休暇申請」から申請できます。希望日の3営業日前までに申請してください。',
                    confidence: 0.92,
                    is_deleted: false
                  },
                  {
                    faq_id_at_answer: 15,
                    current_faq_id: 15,
                    question: '休暇申請の承認フローを教えてください',
                    answer: '休暇申請は直属の上長が承認します。承認後、申請者と人事部に通知メールが送信されます。',
                    confidence: 0.78,
                    is_deleted: false
                  }
                ]
              }
            ],
            limit: 20,
            offset: 0,
            total: 1
          };

        case 'multi':
          return {
            items: [
              {
                history_id: 5,
                question: '社内Wi-Fiのパスワードを教えてください',
                answer: '社内Wi-Fiのパスワードは、情報システム部から配布されるセキュリティカードに記載されています。紛失した場合は情報システム部（内線: 3456）へお問い合わせください。',
                status: 'ai_answer',
                created_at: '2026-08-28T09:15:00Z',
                sources: [
                  {
                    faq_id_at_answer: 20,
                    current_faq_id: 20,
                    question: '社内Wi-Fiの接続方法を教えてください',
                    answer: 'セキュリティカードに記載のSSIDとパスワードで接続できます。紛失時は情報システム部へ。',
                    confidence: 0.88,
                    is_deleted: false
                  }
                ]
              },
              {
                history_id: 4,
                question: '経費精算の締め日はいつですか',
                answer: '経費精算の締め日は毎月25日です。25日が土日祝日の場合は、直前の営業日が締め日となります。翌月10日に指定口座へ振り込まれます。',
                status: 'direct_faq',
                created_at: '2026-08-27T11:00:00Z',
                sources: [
                  {
                    faq_id_at_answer: 8,
                    current_faq_id: 8,
                    question: '経費精算の締め日と振込日を教えてください',
                    answer: '経費精算の締め日は毎月25日です。25日が土日祝日の場合は、直前の営業日が締め日となります。翌月10日に指定口座へ振り込まれます。',
                    confidence: 0.95,
                    is_deleted: false
                  }
                ]
              },
              {
                history_id: 3,
                question: '近くのおすすめのランチスポットを教えて',
                answer: 'お探しの情報が見つかりませんでした。人事部（内線: 1234）または総務部（内線: 5678）までお問い合わせください。',
                status: 'no_match',
                created_at: '2026-08-27T12:00:00Z',
                sources: []
              },
              {
                history_id: 2,
                question: '健康診断の予約方法を教えてください',
                answer: 'お探しの情報が見つかりませんでした。人事部（内線: 1234）または総務部（内線: 5678）までお問い合わせください。',
                status: 'ai_unavailable',
                created_at: '2026-08-27T14:20:00Z',
                sources: []
              },
              {
                history_id: 1,
                question: '出張申請の手順を教えてください',
                answer: 'システムエラーが発生しました。しばらく時間をおいてから再度お試しください。',
                status: 'server_error',
                created_at: '2026-08-27T16:45:00Z',
                sources: []
              }
            ],
            limit: 20,
            offset: 0,
            total: 5
          };

        case 'deleted_faq':
          return {
            items: [
              {
                history_id: 10,
                question: '旧社内規程の変更点を教えてください',
                answer: '旧社内規程では、出勤時間は9:00〜18:00と定められていました。2026年4月の改定により、フレックスタイム制が導入され、コアタイムは10:00〜15:00に変更されました。',
                status: 'ai_answer',
                created_at: '2026-08-25T14:00:00Z',
                sources: [
                  {
                    faq_id_at_answer: 5,
                    current_faq_id: null,
                    question: '勤務時間の規定を教えてください',
                    answer: '出勤時間は9:00〜18:00です。昼休みは12:00〜13:00です。',
                    confidence: 0.85,
                    is_deleted: true
                  },
                  {
                    faq_id_at_answer: 22,
                    current_faq_id: 22,
                    question: 'フレックスタイム制のコアタイムは何時ですか？',
                    answer: 'コアタイムは10:00〜15:00です。フレキシブルタイムは7:00〜10:00、15:00〜22:00です。',
                    confidence: 0.79,
                    is_deleted: false
                  }
                ]
              }
            ],
            limit: 20,
            offset: 0,
            total: 1
          };

        case 'no_source':
          return {
            items: [
              {
                history_id: 7,
                question: '近くのおすすめのランチスポットを教えて',
                answer: 'お探しの情報が見つかりませんでした。人事部（内線: 1234）または総務部（内線: 5678）までお問い合わせください。',
                status: 'no_match',
                created_at: '2026-08-27T12:00:00Z',
                sources: []
              }
            ],
            limit: 20,
            offset: 0,
            total: 1
          };

        default:
          return { items: [], limit: 20, offset: 0, total: 0 };
      }
    }

    // ===== DOM要素参照 =====
    var elHistoryCards = document.getElementById('history_cards');
    var elEmptyMsg     = document.getElementById('empty_msg');

    // ===== HTMLエスケープ =====
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ===== 日時フォーマット (YYYY/MM/DD HH:mm) =====
    function formatDatetime(isoStr) {
      var d = new Date(isoStr);
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      var hh = String(d.getHours()).padStart(2, '0');
      var mi = String(d.getMinutes()).padStart(2, '0');
      return yyyy + '/' + mm + '/' + dd + ' ' + hh + ':' + mi;
    }

    // ===== 全エリアリセット =====
    function resetAll() {
      elHistoryCards.innerHTML = '';
      elEmptyMsg.classList.add('hidden');
    }

    // ===== 出典FAQテーブル構築 =====
    function buildSourceArea(sources) {
      var container = document.createElement('div');
      container.className = 'source-area';

      var label = document.createElement('div');
      label.className = 'card-section-label';
      label.textContent = '出典FAQ';
      container.appendChild(label);

      var table = document.createElement('table');
      table.className = 'source-table';

      // thead
      var thead = document.createElement('thead');
      var headerRow = document.createElement('tr');
      var headers = ['質問文', '回答文', '類似度'];
      for (var h = 0; h < headers.length; h++) {
        var th = document.createElement('th');
        th.textContent = headers[h];
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // tbody
      var tbody = document.createElement('tbody');
      for (var i = 0; i < sources.length; i++) {
        var s = sources[i];
        var tr = document.createElement('tr');

        var tdQ = document.createElement('td');
        tdQ.textContent = s.question;
        tr.appendChild(tdQ);

        var tdA = document.createElement('td');
        tdA.textContent = s.answer;
        tr.appendChild(tdA);

        var tdC = document.createElement('td');
        var badge = document.createElement('span');
        badge.className = 'confidence-badge';
        badge.textContent = s.confidence.toFixed(2);
        tdC.appendChild(badge);
        tr.appendChild(tdC);

        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      container.appendChild(table);

      return container;
    }

    // ===== 履歴カード描画 =====
    function renderHistoryCards(items) {
      elHistoryCards.innerHTML = '';

      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var card = document.createElement('div');
        card.className = 'history-card';

        // カードヘッダー（日時 + ステータス）
        var header = document.createElement('div');
        header.className = 'card-header';

        var datetime = document.createElement('span');
        datetime.className = 'card-datetime';
        datetime.textContent = formatDatetime(item.created_at);
        header.appendChild(datetime);

        var statusSpan = document.createElement('span');
        statusSpan.className = 'status-label ' + item.status;
        statusSpan.textContent = STATUS_LABELS[item.status] || item.status;
        header.appendChild(statusSpan);

        card.appendChild(header);

        // 質問セクション
        var qSection = document.createElement('div');
        qSection.className = 'card-section';

        var qLabel = document.createElement('div');
        qLabel.className = 'card-section-label';
        qLabel.textContent = '質問';
        qSection.appendChild(qLabel);

        var qText = document.createElement('div');
        qText.className = 'card-section-text';
        qText.textContent = item.question;
        qSection.appendChild(qText);

        card.appendChild(qSection);

        // 回答セクション
        var aSection = document.createElement('div');
        aSection.className = 'card-section';

        var aLabel = document.createElement('div');
        aLabel.className = 'card-section-label';
        aLabel.textContent = '回答';
        aSection.appendChild(aLabel);

        var aText = document.createElement('div');
        aText.className = 'card-section-text';
        aText.textContent = item.answer;
        aSection.appendChild(aText);

        card.appendChild(aSection);

        // 出典セクション
        if (item.sources && item.sources.length > 0) {
          var sourceArea = buildSourceArea(item.sources);
          card.appendChild(sourceArea);
        } else if (item.status === 'no_match' || item.status === 'ai_unavailable' || item.status === 'server_error') {
          var noSourceMsg = document.createElement('div');
          noSourceMsg.className = 'no-source-msg';
          noSourceMsg.textContent = '出典が見つかりません';
          card.appendChild(noSourceMsg);
        }

        elHistoryCards.appendChild(card);
      }
    }

    // ===== 状態切替メイン =====
    function setState(pattern) {
      resetAll();

      // ボタンのactive状態更新
      var btns = document.querySelectorAll('.mockup-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      if (event && event.target && event.target.classList.contains('mockup-btn')) {
        event.target.classList.add('active');
      }

      var data = getDummyHistoryList(pattern);

      if (data.items.length === 0) {
        // 0件: 空メッセージ表示
        elEmptyMsg.classList.remove('hidden');
      } else {
        // カード描画
        renderHistoryCards(data.items);
      }
    }

    // ===== 初期状態 =====
    setState('empty');
  </script>
  <script src="nav.js"></script>

</body>
</html>
