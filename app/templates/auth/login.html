{% extends "_page_base.html" %}

{% block title %}HELPO - ログイン{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">ログイン</h2>

    {% if error == "invalid_credentials" %}
    <div class="alert alert-error">
      ユーザー名またはパスワードが正しくありません。
    </div>
    {% elif error == "too_many_attempts" %}
    <div class="alert alert-error">
      ログイン試行回数が上限を超えたため、しばらくの間ログインできません。時間をおいて再度お試しください。
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">ユーザー名</label>
        <input type="text" id="username" name="username" class="form-input" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" />
      </div>
      <button type="submit" class="submit-btn">ログイン</button>
    </form>
  </div>
</div>
{% endblock %}
